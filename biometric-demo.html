<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WAAXXSS Biometric Demo</title><style>:root{--bg:#f6f3ee;--ink:#111;--gold:#b28b51;--line:#ddd7ce}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(420px,100%);background:#fff;border:1px solid var(--line);padding:28px;box-shadow:0 20px 60px #0001}.brand{font-size:13px;letter-spacing:.24em;font-weight:900}.ey{font-size:10px;color:var(--gold);letter-spacing:.18em;font-weight:900;margin-top:28px}h1{font-size:36px;line-height:1.05;margin:8px 0 12px}.desc{font-size:13px;line-height:1.65;color:#666}.bio{margin:24px auto 16px;width:112px;height:112px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:48px}.btn{width:100%;padding:15px;border:0;background:#111;color:#fff;font-weight:900;margin-top:8px}.btn.alt{background:#fff;color:#111;border:1px solid #111}.status{margin-top:16px;padding:12px;background:#f0ece4;font-size:12px;line-height:1.5}.ok{color:#156d32}.bad{color:#9c2d2d}.tiny{font-size:10px;color:#888;line-height:1.5;margin-top:14px}</style></head><body><div class="wrap"><div class="card"><div class="brand">WAAXXSS</div><div class="ey">BIOMETRIC ACCESS · DEMO</div><h1>지문 · 생체인증</h1><p class="desc">이 화면은 휴대폰의 플랫폼 생체인증 기능을 호출하는 데모입니다. 기기에 따라 지문, 얼굴, PIN/패턴이 표시될 수 있습니다.</p><div class="bio">◉</div><button class="btn" onclick="registerBio()">생체인증 등록</button><button class="btn alt" onclick="verifyBio()">생체인증으로 확인</button><div id="status" class="status">기기 지원 여부를 확인 중입니다.</div><div class="tiny">데모 버전: 서버 검증·결제 승인·회원 보안 잠금에는 사용하지 않습니다. 실제 서비스에서는 서버 challenge 검증, 계정 바인딩, 세션 만료 정책을 추가해야 합니다.</div></div></div><script>const statusEl=document.getElementById('status');const enc=new TextEncoder();function b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function fromB64url(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function setStatus(msg,ok=false){statusEl.className='status '+(ok?'ok':'bad');statusEl.textContent=msg}async function supported(){if(!window.PublicKeyCredential){setStatus('이 브라우저는 WebAuthn을 지원하지 않습니다.');return false}try{const a=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();setStatus(a?'이 기기에서 생체인증 사용 가능':'플랫폼 생체인증을 사용할 수 없습니다.',a);return a}catch(e){setStatus('생체인증 지원 여부 확인 실패: '+e.message);return false}}async function registerBio(){if(!(await supported()))return;try{const challenge=crypto.getRandomValues(new Uint8Array(32));const userId=crypto.getRandomValues(new Uint8Array(16));const cred=await navigator.credentials.create({publicKey:{challenge,rp:{name:'WAAXXSS'},user:{id:userId,name:'waaxxss-demo@local',displayName:'WAAXXSS Demo'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none'}});localStorage.setItem('waaxxss_cred',b64url(cred.rawId));setStatus('생체인증 등록 성공 · 이 기기에 데모 자격증명을 저장했습니다.',true)}catch(e){setStatus('등록 취소 또는 실패: '+e.message)}}async function verifyBio(){if(!(await supported()))return;const saved=localStorage.getItem('waaxxss_cred');if(!saved){setStatus('먼저 생체인증 등록을 진행하세요.');return}try{const assertion=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:fromB64url(saved)}],userVerification:'required',timeout:60000}});if(assertion)setStatus('생체인증 성공 · WAAXXSS 데모 접근 허용',true)}catch(e){setStatus('인증 취소 또는 실패: '+e.message)}}supported();</script></body></html>
