<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WAAXXSS — Premium Golf & Lifestyle</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Arial,'Noto Sans KR',sans-serif}#stage{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .55s}#stage.ready{opacity:1}#intro{position:fixed;inset:0;z-index:10;background:#050505;color:#fff;overflow:hidden;transition:opacity .65s,visibility .65s}#intro.hide{opacity:0;visibility:hidden;pointer-events:none}.shot{position:absolute;inset:-2%;background:#090909 center center/cover no-repeat;opacity:0;transform:scale(1.06);transition:opacity .38s ease,transform 1.1s ease}.shot.on{opacity:1;transform:scale(1)}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.7) 82%);z-index:1}.flash{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent 28%,rgba(255,255,255,.22) 49%,transparent 70%);transform:translateX(-125%)}.flash.go{animation:sweep .62s ease}.logo{position:absolute;z-index:4;top:8%;left:50%;transform:translateX(-50%);width:min(210px,50vw);height:96px;object-fit:contain;filter:brightness(0) invert(1);drop-shadow:0 5px 20px #000}.copy{position:absolute;z-index:4;left:18px;right:18px;bottom:15%;text-align:center;text-shadow:0 2px 18px #000}.copy small{font-size:9px;letter-spacing:.29em}.copy h1{font-size:clamp(32px,9vw,58px);line-height:.92;margin:12px 0}.copy p{font-size:10px;letter-spacing:.14em;color:#ddd}.bar{position:absolute;z-index:4;left:13%;right:13%;bottom:8.5%;height:2px;background:#ffffff26}.bar i{display:block;height:100%;background:#eee;animation:load 5.8s linear forwards}.status{position:absolute;z-index:4;left:0;right:0;bottom:5.2%;text-align:center;color:#bbb;font-size:8px;letter-spacing:.16em}.skip{position:absolute;z-index:5;right:16px;top:16px;border:1px solid #ffffff55;background:#0008;color:#fff;padding:8px 13px;border-radius:22px}@keyframes load{from{width:0}to{width:100%}}@keyframes sweep{to{transform:translateX(125%)}}</style></head><body><iframe id="stage" src="./v21.html"></iframe><div id="intro"><div class="shot on" id="shotA"></div><div class="shot" id="shotB"></div><div class="shade"></div><div class="flash" id="flash"></div><img class="logo" src="./assets/logo.svg" alt="WAAXXSS"><div class="copy"><small>WAAXXSS KOREA</small><h1>PREMIUM<br>GOLF & STYLE</h1><p>GOLFWEAR · AI · LIFESTYLE</p></div><div class="bar"><i></i></div><div class="status" id="status">LOADING COLLECTION</div><button class="skip" onclick="enter(true)">SKIP</button></div><script>const f=document.getElementById('stage'),intro=document.getElementById('intro'),a=document.getElementById('shotA'),b=document.getElementById('shotB'),fx=document.getElementById('flash'),statusEl=document.getElementById('status');let entered=false,started=Date.now(),active=a,timer=null;const mods=['transition-flash-v2.js','home-upgrade-v1.js','image-resilience-v3.js','visual-fidelity-v1.js','logo-guard-v1.js','product-data-bridge-v1.js','supabase-auth-v1.js','ux-continuity-v4.js','system-qa-v5.js','security-hardening-v1.js','qa-dashboard-bridge-v1.js'];function usable(src){return typeof src==='string'&&src&&!src.startsWith('data:image/svg')&&!/logo/i.test(src)}function collect(d){const out=[];[...d.images].forEach(im=>{const s=im.currentSrc||im.src;if(usable(s)&&!out.includes(s)&&im.naturalWidth>=260)out.push(s)});return out.slice(0,6)}function flashTo(src){if(!src)return;const next=active===a?b:a;next.style.backgroundImage=`url("${src.replace(/"/g,'%22')}")`;next.classList.add('on');active.classList.remove('on');active=next;fx.classList.remove('go');void fx.offsetWidth;fx.classList.add('go')}async function preload(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(true);i.onerror=()=>r(false);i.src=src;setTimeout(()=>r(false),1800)})}async function startPhotos(d){const shots=collect(d);if(!shots.length){statusEl.textContent='WAAXXSS';return}const good=[];for(const s of shots){if(await preload(s))good.push(s)}if(!good.length){statusEl.textContent='WAAXXSS';return}statusEl.textContent='COLLECTION READY';let n=0;flashTo(good[0]);timer=setInterval(()=>{n=(n+1)%good.length;flashTo(good[n])},850)}function loadMods(d){for(const src of mods){if(d.querySelector(`script[src*="${src}"]`))continue;const s=d.createElement('script');s.src='./'+src;s.async=true;s.onerror=()=>{};d.body.appendChild(s)}}function enter(force=false){if(entered)return;entered=true;if(timer)clearInterval(timer);const wait=force?0:Math.max(0,5600-(Date.now()-started));setTimeout(()=>{f.classList.add('ready');intro.classList.add('hide')},wait)}f.addEventListener('load',()=>{try{const d=f.contentDocument;if(d){const old=d.getElementById('splash');if(old)old.style.display='none';loadMods(d);startPhotos(d);try{d.defaultView.WAAXXSS_LAUNCHER_VERSION='28'}catch(e){}}}catch(e){statusEl.textContent='OPENING WAAXXSS'}setTimeout(()=>enter(false),900)});setTimeout(()=>enter(false),7200)</script></body></html>
