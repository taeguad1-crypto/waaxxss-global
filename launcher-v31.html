<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5,user-scalable=yes"><title>WAAXXSS — BEYOND THE EDGE</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;font-family:Arial,'Noto Sans KR',sans-serif}#stage{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .5s}#stage.ready{opacity:1}#intro{position:fixed;inset:0;z-index:10;background:#080808;color:#fff;overflow:hidden;transition:opacity .55s,visibility .55s}#intro.hide{opacity:0;visibility:hidden;pointer-events:none}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%;background:#151515;transform:scale(1.01)}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.12) 48%,rgba(0,0,0,.76) 88%)}.copy{position:absolute;left:18px;right:18px;bottom:12%;text-align:center;text-shadow:0 2px 14px #000}.copy small{font-size:10px;letter-spacing:.30em}.copy h1{font-size:clamp(34px,9vw,58px);line-height:.96;margin:12px 0 10px}.copy p{margin:0;font-size:12px;letter-spacing:.14em}.bar{height:2px;background:#ffffff38;margin:22px auto 0;max-width:72%}.bar i{display:block;height:100%;background:#fff;animation:load 3.2s linear forwards}.status{margin-top:10px;font-size:9px;letter-spacing:.18em;color:#ddd}.skip{position:absolute;right:16px;top:16px;z-index:3;border:1px solid #ffffff48;background:#111b;color:#fff;padding:8px 14px;border-radius:22px;font-size:12px}@keyframes load{from{width:0}to{width:100%}}</style><script src="./wx-photo-2.js"></script></head><body><iframe id="stage" src="./v21.html"></iframe><div id="intro"><img id="hero" class="hero" alt="WAAXXSS collection"><div class="shade"></div><button class="skip" id="skip">SKIP</button><div class="copy"><small>WAAXXSS KOREA</small><h1>BEYOND THE EDGE</h1><p>경계를 넘어 세계로</p><div class="bar"><i></i></div><div class="status">WAAXXSS COLLECTION</div></div></div><script>(()=>{const f=document.getElementById('stage'),intro=document.getElementById('intro'),hero=document.getElementById('hero');let entered=false;const P=window.WX_PHOTO_2||'';if(P){hero.src=P;hero.onerror=()=>{hero.style.display='none';document.getElementById('intro').style.background='linear-gradient(145deg,#171717,#050505)'}}function enter(){if(entered)return;entered=true;f.classList.add('ready');intro.classList.add('hide')}document.getElementById('skip').onclick=enter;function inject(){try{const d=f.contentDocument;if(!d||!d.body)return;const mods=['wx-photo-2.js','photo-recovery-v1.js','product-scroll-v1.js','chat-command-center-v1.js','developer-credit-v1.js'];mods.forEach(src=>{if(d.querySelector('script[src*="'+src+'"]'))return;const s=d.createElement('script');s.src='./'+src;s.async=false;d.body.appendChild(s)});try{f.contentWindow.WAAXXSS_LAUNCHER_VERSION='31.0'}catch(e){}}catch(e){}}f.addEventListener('load',()=>{inject();setTimeout(enter,2100)});setTimeout(enter,4200)})();</script></body></html>
