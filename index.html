<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<title>WAAXXSS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0c;color:#f4f0e8;font-family:Arial,'Noto Sans KR',sans-serif}body{min-height:100svh}.appframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .35s ease;touch-action:auto}.appframe.ready{opacity:1}.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 36%,#24211f 0,#151517 36%,#0a0a0c 74%);cursor:pointer;transition:opacity .35s ease,visibility .35s ease}.screen.hide{opacity:0;visibility:hidden;pointer-events:none}.screen:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,rgba(210,191,158,.10),transparent 35%),linear-gradient(180deg,rgba(255,255,255,.02),transparent 26%,transparent 74%,rgba(0,0,0,.25))}.content{position:relative;z-index:2;width:min(88vw,620px);display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateY(-1vh)}.logoWrap{width:min(44vw,220px);display:grid;place-items:center}.logo{display:block;width:100%;height:auto;object-fit:contain}.tag{margin-top:22px;font-size:clamp(9px,2.4vw,12px);font-weight:600;letter-spacing:.29em;margin-right:-.29em;color:#a49b8f}.line{margin-top:28px;width:min(42vw,210px);height:1px;background:#2d2925;overflow:hidden}.line:after{content:"";display:block;height:100%;width:0;background:#a89577;animation:load 2.2s linear forwards}.enter{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;letter-spacing:.26em;color:#716d67}@keyframes load{to{width:100%}}@media(max-width:520px){.logoWrap{width:min(46vw,205px)}}
</style>
</head>
<body>
<iframe id="app" class="appframe" src="./v21.html" title="WAAXXSS Global"></iframe>
<main class="screen" id="screen" role="button" tabindex="0" aria-label="Enter WAAXXSS"><section class="content"><div class="logoWrap"><img id="officialLogo" class="logo" src="./file_00000000c3d0820983b48532d4a822ef.png" alt="WAAXXSS official logo"></div><div class="tag">BEYOND THE EDGE · KOREA</div><div class="line"></div></section><div class="enter">TAP TO ENTER</div></main>
<script>
(function(){
 const screen=document.getElementById('screen'),app=document.getElementById('app'),img=document.getElementById('officialLogo');
 const LOGO='./file_00000000c3d0820983b48532d4a822ef.png';
 function clearWhite(){try{const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});c.width=img.naturalWidth;c.height=img.naturalHeight;x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){const v=(p[i]+p[i+1]+p[i+2])/3;if(v>205)p[i+3]=Math.max(0,Math.min(255,(235-v)*8.5));else{p[i]=224;p[i+1]=216;p[i+2]=201}}x.putImageData(d,0,0);img.src=c.toDataURL('image/png')}catch(e){}}
 if(img.complete)clearWhite();else img.addEventListener('load',clearWhite,{once:true});
 let entered=false;
 function reveal(){if(entered)return;entered=true;screen.classList.add('hide');app.classList.add('ready')}
 function addScript(d,src,id){if(d.getElementById(id))return;const s=d.createElement('script');s.id=id;s.src=src;s.defer=true;d.body.appendChild(s)}
 function repairApp(){
  try{
   const w=app.contentWindow,d=app.contentDocument;if(!w||!d)return;
   const splash=d.getElementById('splash');if(splash)splash.remove();
   d.querySelectorAll('[data-logo]').forEach(el=>{el.src=LOGO;el.onerror=null});
   let images=null;
   try{images=w.eval('typeof IMAGES!=="undefined"?IMAGES:null')}catch(e){}
   if(images){d.querySelectorAll('[data-img]').forEach(el=>{const k=el.dataset.img;if(images[k])el.src=images[k]})}
   try{w.LOGO=LOGO;if(typeof w.initAssets==='function')w.initAssets()}catch(e){}
   try{if(typeof w.renderHome==='function')w.renderHome();if(typeof w.renderShop==='function')w.renderShop()}catch(e){}
   addScript(d,'./chat-command-center-v1.js','wx-chat-loader');
   addScript(d,'./chat-inline-media-v1.js','wx-chat-media-loader');
   d.documentElement.style.touchAction='manipulation';d.body.style.touchAction='pan-x pan-y pinch-zoom';
   d.querySelectorAll('button,a').forEach(el=>{el.style.touchAction='manipulation';el.style.webkitTapHighlightColor='rgba(0,0,0,.08)'});
   d.querySelectorAll('button').forEach(el=>{if((el.textContent||'').trim()==='AI SHOP'&&!el.dataset.wxAiBound){el.dataset.wxAiBound='1';el.addEventListener('click',()=>setTimeout(()=>{try{if(w.WAAXXSS_CHAT)w.WAAXXSS_CHAT.open()}catch(e){}},120))}});
   app.classList.add('ready');
  }catch(e){app.classList.add('ready')}
 }
 app.addEventListener('load',()=>{repairApp();setTimeout(repairApp,180);setTimeout(repairApp,700);setTimeout(repairApp,1600)});
 screen.addEventListener('click',()=>{repairApp();reveal()});
 screen.addEventListener('touchend',e=>{e.preventDefault();repairApp();reveal()},{passive:false});
 screen.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();repairApp();reveal()}});
 setTimeout(()=>{repairApp();reveal()},2200);setTimeout(repairApp,3800);
})();
</script>
</body>
</html>
