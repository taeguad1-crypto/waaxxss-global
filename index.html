<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes"><title>WAAXXSS</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#fff;color:#000;font-family:Arial,'Noto Sans KR',sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center}.screen{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#fff;cursor:pointer}.mark{font-size:18px;font-weight:900;letter-spacing:.45em;margin-right:-.45em}.title{font-size:clamp(42px,12vw,86px);font-weight:900;line-height:.88;letter-spacing:-.055em;margin:28px 0 18px}.sub{font-size:14px;font-weight:800;letter-spacing:.18em}.line{width:72%;max-width:420px;height:6px;background:#e8e8e8;margin-top:34px;overflow:hidden}.line i{display:block;width:0;height:100%;background:#000;animation:load 4.5s linear forwards}.enter{margin-top:24px;border:1px solid #000;border-radius:999px;padding:12px 20px;font-size:10px;font-weight:900;letter-spacing:.18em;background:#fff;color:#000}.screen{animation:fadeOut .45s ease 4.05s forwards}@keyframes load{to{width:100%}}@keyframes fadeOut{to{opacity:0}}@media(prefers-reduced-motion:reduce){.line i,.screen{animation:none}}</style></head><body><main class="screen" id="screen" role="button" tabindex="0" aria-label="Enter WAAXXSS"><div class="mark">WAAXXSS KOREA</div><div class="title">BEYOND<br>THE EDGE</div><div class="sub">경계를 넘어 세계로</div><div class="line"><i></i></div><div class="enter">ENTER WAAXXSS</div></main><script>(function(){let done=false;function go(){if(done)return;done=true;location.replace('./v21.html')}const s=document.getElementById('screen');s.addEventListener('click',go);s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});setTimeout(go,4500)})();</script></body></html>
