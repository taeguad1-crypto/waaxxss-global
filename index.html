<!doctype html>

<title>WAAXXSS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}body{min-height:100svh}.screen{position:relative;width:100%;height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#242424 0,#111 31%,#050505 70%);cursor:pointer;isolation:isolate}.screen:before{content:"";position:absolute;inset:-20%;background:radial-gradient(ellipse at 50% -5%,rgba(255,244,214,.24),transparent 34%),radial-gradient(circle at 50% 48%,rgba(255,255,255,.08),transparent 27%);animation:breathe 4.5s ease-in-out forwards}.beam{position:absolute;top:-18%;left:50%;width:32vw;max-width:420px;height:88%;transform:translateX(-50%) perspective(600px) rotateX(7deg);background:linear-gradient(180deg,rgba(255,247,225,.23),rgba(255,255,255,.045) 56%,transparent 88%);filter:blur(16px);clip-path:polygon(39% 0,61% 0,100% 100%,0 100%);opacity:0;animation:beam 4.5s ease forwards}.dust{position:absolute;inset:0;opacity:.5;background-image:radial-gradient(circle,rgba(255,230,174,.8) 0 1px,transparent 1.4px),radial-gradient(circle,rgba(255,255,255,.55) 0 1px,transparent 1.3px);background-size:83px 83px,131px 131px;background-position:13px 22px,47px 61px;animation:dust 4.5s ease-out forwards}.floor{position:absolute;left:10%;right:10%;bottom:10%;height:18%;border-radius:50%;background:radial-gradient(ellipse,rgba(232,211,169,.22),rgba(255,255,255,.04) 34%,transparent 70%);filter:blur(8px);transform:perspective(400px) rotateX(68deg);opacity:0;animation:floor 4.5s ease forwards}.content{position:relative;z-index:3;width:min(86vw,650px);display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateY(-1vh)}.logoWrap{position:relative;width:min(55vw,300px);aspect-ratio:1/1;display:grid;place-items:center;opacity:0;transform:scale(.64) rotateY(-18deg);animation:logoReveal 4.5s cubic-bezier(.16,.84,.2,1) forwards}.logoWrap:before{content:"";position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle,rgba(255,239,204,.23),transparent 67%);filter:blur(18px);animation:pulse 1.7s ease-in-out 1.1s infinite alternate}.logo{position:relative;z-index:2;display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:screen;filter:grayscale(1) invert(1) contrast(1.65) drop-shadow(0 10px 28px rgba(255,239,205,.18))}.brand{margin-top:-5px;font-size:clamp(16px,4.3vw,25px);font-weight:700;letter-spacing:.47em;margin-right:-.47em;color:#e8e1d5;opacity:0;transform:translateY(13px);animation:textIn .9s ease 1.55s forwards}.tag{margin-top:16px;font-size:clamp(9px,2.5vw,12px);font-weight:600;letter-spacing:.29em;margin-right:-.29em;color:#8e8a82;opacity:0;animation:textIn .8s ease 2s forwards}.enter{position:absolute;z-index:5;bottom:max(26px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;letter-spacing:.28em;color:#777;opacity:0;animation:enterIn .6s ease 2.5s forwards}.flash{position:absolute;z-index:6;inset:0;pointer-events:none;background:#fff;opacity:0;animation:impact 4.5s ease forwards}.screen{animation:exit 4.5s ease forwards}@keyframes logoReveal{0%,12%{opacity:0;transform:scale(.62) rotateY(-20deg);filter:blur(10px)}30%{opacity:1;transform:scale(1.035) rotateY(1deg);filter:blur(0)}47%,86%{opacity:1;transform:scale(1) rotateY(0)}100%{opacity:0;transform:scale(1.025)}}@keyframes beam{0%,10%{opacity:0}28%{opacity:.9}72%{opacity:.55}100%{opacity:0}}@keyframes dust{0%{opacity:0;transform:scale(1.12) translateY(18px)}30%{opacity:.58}85%{opacity:.42;transform:scale(1) translateY(-8px)}100%{opacity:0}}@keyframes floor{0%,18%{opacity:0;transform:perspective(400px) rotateX(68deg) scale(.65)}42%{opacity:1;transform:perspective(400px) rotateX(68deg) scale(1)}100%{opacity:0}}@keyframes pulse{from{transform:scale(.85);opacity:.35}to{transform:scale(1.2);opacity:.75}}@keyframes textIn{to{opacity:1;transform:translateY(0)}}@keyframes enterIn{to{opacity:.75}}@keyframes impact{0%,25%{opacity:0}27%{opacity:.34}30%,100%{opacity:0}}@keyframes breathe{0%{transform:scale(1.15);opacity:.3}50%{transform:scale(1);opacity:1}100%{transform:scale(1.04);opacity:.25}}@keyframes exit{0%,88%{opacity:1}100%{opacity:0}}@media(max-width:520px){.logoWrap{width:min(61vw,265px)}.content{transform:translateY(-2vh)}}@media(prefers-reduced-motion:reduce){.screen,.beam,.dust,.floor,.logoWrap,.brand,.tag,.enter,.flash,.screen:before{animation:none}.logoWrap,.brand,.tag,.enter{opacity:1}}
</style>
</head>
<body>
<main class="screen" id="screen" role="button" tabindex="0" aria-label="Enter WAAXXSS">

<section class="content">
<div class="logoWrap"><img class="logo" src="./file_00000000c3d0820983b48532d4a822ef.png" alt="WAAXXSS official logo"></div>

</section>

</main>
<script>
(function(){let done=false,timer;function go(){if(done)return;done=true;clearTimeout(timer);location.replace('./v21.html')}const s=document.getElementById('screen');s.addEventListener('click',go);s.addEventListener('touchend',function(e){e.preventDefault();go()},{passive:false});s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});timer=setTimeout(go,4500)})();
</script>
