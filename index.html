<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5,user-scalable=yes"><title>WAAXXSS Flash Preview</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;font-family:Arial,'Noto Sans KR',sans-serif}body{display:grid;place-items:center}.flash{position:fixed;inset:0;background:linear-gradient(145deg,#1a1a1a,#050505);color:#fff;overflow:hidden}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%;opacity:.96}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.18) 52%,rgba(0,0,0,.78) 90%)}.copy{position:absolute;left:18px;right:18px;bottom:13%;z-index:2;text-align:center;text-shadow:0 2px 18px #000}.copy small{font-size:10px;letter-spacing:.3em}.copy h1{font-size:clamp(34px,9vw,58px);line-height:.95;margin:12px 0 10px}.copy p{font-size:12px;letter-spacing:.13em}.bar{height:2px;background:#ffffff30;margin:22px auto 0;max-width:72%}.bar i{display:block;height:100%;background:#fff;animation:load 4s linear forwards}.badge{position:absolute;top:16px;right:16px;z-index:2;border:1px solid #ffffff55;border-radius:999px;padding:8px 12px;font-size:11px;background:#0008}.pulse{position:absolute;inset:0;z-index:1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);transform:translateX(-130%);animation:sweep 2.8s ease-in-out infinite}@keyframes load{from{width:0}to{width:100%}}@keyframes sweep{0%,55%{transform:translateX(-130%)}80%,100%{transform:translateX(130%)}}</style><script src="./wx-photo-2.js"></script></head><body><div class="flash"><img id="photo" class="photo" alt="WAAXXSS collection"><div class="shade"></div><div class="pulse"></div><div class="badge">FLASH PREVIEW</div><div class="copy"><small>WAAXXSS KOREA</small><h1>BEYOND THE EDGE</h1><p>경계를 넘어 세계로</p><div class="bar"><i></i></div></div></div><script>const p=document.getElementById('photo');const src=window.WX_PHOTO_2||'';if(src)p.src=src;else p.style.display='none';</script></body></html>
