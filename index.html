<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes"><title>WAAXXSS</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0c;color:#f4f0e8;font-family:Arial,'Noto Sans KR',sans-serif}body{min-height:100svh}.screen{position:relative;width:100%;height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 36%,#24211f 0,#151517 36%,#0a0a0c 74%);cursor:pointer}.screen:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,rgba(210,191,158,.10),transparent 35%),linear-gradient(180deg,rgba(255,255,255,.02),transparent 26%,transparent 74%,rgba(0,0,0,.25))}.content{position:relative;z-index:2;width:min(88vw,620px);display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateY(-1vh)}.logoWrap{width:min(44vw,220px);display:grid;place-items:center}.logo{display:block;width:100%;height:auto;object-fit:contain;filter:drop-shadow(0 14px 30px rgba(197,178,147,.16))}.tag{margin-top:22px;font-size:clamp(9px,2.4vw,12px);font-weight:600;letter-spacing:.29em;margin-right:-.29em;color:#a49b8f}.line{margin-top:28px;width:min(42vw,210px);height:1px;background:linear-gradient(90deg,transparent,#7f715e,transparent)}.enter{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;letter-spacing:.26em;color:#716d67}.screen{animation:softExit 4.5s ease forwards}@keyframes softExit{0%,88%{opacity:1}100%{opacity:0}}@media(max-width:520px){.logoWrap{width:min(46vw,205px)}}@media(prefers-reduced-motion:reduce){.screen{animation:none}}</style></head><body><main class="screen" id="screen" role="button" tabindex="0" aria-label="Enter WAAXXSS"><section class="content"><div class="logoWrap"><img id="officialLogo" class="logo" src="./file_00000000c3d0820983b48532d4a822ef.png" alt="WAAXXSS official logo"></div><div class="tag">BEYOND THE EDGE · KOREA</div><div class="line"></div></section><div class="enter">TAP TO ENTER</div></main><script>(function(){const img=document.getElementById('officialLogo');function clearWhite(){try{const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});c.width=img.naturalWidth;c.height=img.naturalHeight;x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2],v=(r+g+b)/3;if(v>205){const a=Math.max(0,Math.min(255,(235-v)*8.5));p[i+3]=a}else{p[i]=224;p[i+1]=216;p[i+2]=201}}x.putImageData(d,0,0);img.src=c.toDataURL('image/png')}catch(e){img.style.filter='invert(1) grayscale(1)';img.style.mixBlendMode='screen'}}if(img.complete)clearWhite();else img.addEventListener('load',clearWhite,{once:true});let done=false,timer;function go(){if(done)return;done=true;clearTimeout(timer);location.replace('./v21.html')}const s=document.getElementById('screen');s.addEventListener('click',go);s.addEventListener('touchend',function(e){e.preventDefault();go()},{passive:false});s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});timer=setTimeout(go,4500)})();</script></body></html>
