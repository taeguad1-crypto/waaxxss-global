<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>WAAXXSS — Premium Golf & Lifestyle</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;font-family:"Helvetica Neue","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif}body{overflow:hidden}
#intro{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#252525 0,#0c0c0c 34%,#030303 78%);color:#fff;overflow:hidden;transition:opacity .7s ease,visibility .7s ease}
#intro::before{content:"";position:absolute;inset:-30%;background:linear-gradient(112deg,transparent 40%,rgba(255,255,255,.11) 49%,rgba(195,198,202,.24) 50%,rgba(255,255,255,.06) 52%,transparent 61%);transform:translateX(-58%) rotate(-2deg);animation:sweep 4.4s cubic-bezier(.2,.7,.2,1) forwards}
#intro::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 22%,transparent 75%,rgba(0,0,0,.45));pointer-events:none}
.intro-inner{position:relative;z-index:2;width:min(82vw,560px);text-align:center;transform:translateY(-1vh)}
.logo-wrap{margin:0 auto 24px;width:min(49vw,220px);opacity:0;transform:scale(.92);animation:logoIn 1.3s .25s cubic-bezier(.2,.8,.2,1) forwards}
.logo-wrap img{display:block;width:100%;height:auto;filter:brightness(0) invert(1);drop-shadow:0 0 18px rgba(255,255,255,.09)}
.brand{margin:0;font-weight:700;font-size:clamp(25px,7vw,48px);letter-spacing:.19em;padding-left:.19em;opacity:0;animation:fadeUp .9s .72s forwards}
.tag{margin-top:12px;font-size:clamp(9px,2.4vw,12px);letter-spacing:.27em;padding-left:.27em;color:#bfc2c5;font-weight:700;opacity:0;animation:fadeUp .9s 1.05s forwards}
.sub{margin-top:7px;font-size:clamp(8px,2.1vw,10px);letter-spacing:.2em;padding-left:.2em;color:#9b9b9b;opacity:0;animation:fadeUp .9s 1.28s forwards}
.progress{position:absolute;left:12vw;right:12vw;bottom:max(42px,calc(env(safe-area-inset-bottom) + 28px));height:1px;background:rgba(255,255,255,.17);overflow:hidden}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#8e9296,#f3f3f3,#a9adb1);animation:load 4.4s linear forwards}
.skip{position:absolute;z-index:4;top:max(16px,env(safe-area-inset-top));right:16px;border:1px solid rgba(255,255,255,.34);background:rgba(0,0,0,.25);color:#fff;border-radius:999px;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:.12em;backdrop-filter:blur(8px)}
.loading-note{position:absolute;left:0;right:0;bottom:max(58px,calc(env(safe-area-inset-bottom) + 44px));text-align:center;color:#777;font-size:8px;letter-spacing:.18em}
#intro.out{opacity:0;visibility:hidden;pointer-events:none}
@keyframes logoIn{to{opacity:1;transform:scale(1)}}@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes load{to{width:100%}}@keyframes sweep{0%{transform:translateX(-62%) rotate(-2deg)}100%{transform:translateX(62%) rotate(-2deg)}}
@media(prefers-reduced-motion:reduce){#intro::before,.logo-wrap,.brand,.tag,.sub,.progress i{animation-duration:.01ms!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="intro" aria-label="WAAXXSS 시작 화면">
  <button class="skip" type="button" onclick="finishIntro()">SKIP</button>
  <div class="intro-inner">
    <div class="logo-wrap"><img src="./assets/logo.svg" alt="WAAXXSS logo"></div>
    <h1 class="brand">WAAXXSS</h1>
    <div class="tag">PREMIUM GOLF &amp; LIFESTYLE</div>
    <div class="sub">PERFORMANCE · STYLE · GLOBAL</div>
  </div>
  <div class="loading-note">WAAXXSS KOREA</div>
  <div class="progress"><i></i></div>
</div>
<script>
let finished=false;
async function finishIntro(){
  if(finished)return;
  finished=true;
  const intro=document.getElementById('intro');
  intro.classList.add('out');
  try{
    const r=await fetch('./v21.html',{cache:'no-store'});
    if(!r.ok)throw new Error('load failed');
    let html=await r.text();
    html=html.replace('<head>','<head><style>#splash{display:none!important}</style>');
    html=html.replace('<body>','<body data-entry="index-intro">');
    setTimeout(()=>{
      document.open();
      document.write(html);
      document.close();
    },520);
  }catch(e){
    location.replace('./v21.html');
  }
}
setTimeout(finishIntro,4500);
</script>
</body>
</html>
