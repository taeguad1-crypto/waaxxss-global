<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WAAXXSS — Premium Golf & Lifestyle</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Arial,'Noto Sans KR',sans-serif}#stage{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .55s ease}#stage.ready{opacity:1}#intro{position:fixed;inset:0;z-index:10;background:#050505;color:#fff;overflow:hidden;transition:opacity .6s ease,visibility .6s}.bg{position:absolute;inset:-5%;background:radial-gradient(circle at 50% 42%,#303030 0,#111 25%,#050505 58%);animation:breath 4.6s ease forwards}.beam{position:absolute;width:42vw;height:150vh;left:-8vw;top:-25vh;background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);transform:rotate(18deg);filter:blur(18px);animation:sweep 4.4s ease-in-out}.logo{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:min(190px,46vw);height:80px;object-fit:contain;filter:brightness(0) invert(1)}.copy{position:absolute;left:22px;right:22px;bottom:20%;text-align:center}.copy small{font-size:9px;letter-spacing:.28em;color:#cfcfcf}.copy h1{font-size:clamp(34px,10vw,62px);line-height:.92;letter-spacing:-.055em;margin:12px 0}.copy p{font-size:10px;letter-spacing:.14em;color:#c6a56c}.bar{position:absolute;left:14%;right:14%;bottom:9%;height:2px;background:#ffffff25}.bar i{display:block;height:100%;width:0;background:#eee;animation:load 4.2s linear forwards}.skip{position:absolute;right:16px;top:16px;border:1px solid #ffffff55;background:#0007;color:#fff;padding:8px 13px;border-radius:22px}.hide{opacity:0;visibility:hidden;pointer-events:none}@keyframes breath{from{transform:scale(1.09)}to{transform:scale(1)}}@keyframes sweep{0%{left:-50vw;opacity:0}20%{opacity:1}80%{opacity:.7}100%{left:110vw;opacity:0}}@keyframes load{to{width:100%}}</style></head><body><iframe id="stage" src="./v21.html" title="WAAXXSS"></iframe><div id="intro"><div class="bg"></div><div class="beam"></div><img class="logo" src="./assets/logo.svg" alt="WAAXXSS"><div class="copy"><small>WAAXXSS KOREA</small><h1>PREMIUM<br>GOLF & STYLE</h1><p>PRODUCT · DETAIL · AI · GOLF</p></div><div class="bar"><i></i></div><button class="skip" onclick="enter()">SKIP</button></div><script>const f=document.getElementById('stage'),intro=document.getElementById('intro');function inject(){try{const d=f.contentDocument;if(!d)return;const old=d.getElementById('splash');if(old)old.style.display='none';if(!d.querySelector('script[data-wxflash]')){const s=d.createElement('script');s.src='./transition-flash-v2.js';s.dataset.wxflash='1';d.body.appendChild(s)}}catch(e){}}function enter(){inject();f.classList.add('ready');intro.classList.add('hide')}f.addEventListener('load',()=>{inject();setTimeout(()=>f.classList.add('ready'),250)});setTimeout(enter,4400);</script></body></html>
